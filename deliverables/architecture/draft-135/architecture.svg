<svg viewBox="0 0 1600 960" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Архітектура Data Story</title>
<desc id="d">Чернетка 135. Браузер → інтерфейс → сервіс-оркестратор. Аналітичні модулі через шину даних пишуть і читають DuckDB та файли; сервіс веде службовий стан у SQLite. Звіти отримують чернетку від вбудованих AI-функцій і після затвердження передаються в Quarto. Чат і вбудовані AI-функції через спільну шину звертаються до RAG (з моделлю bge-m3, файли якої лежать локально), до OpenAI через інтернет і через сервіс до SQLite (контекст, журнал AI, чернетки); SQL від LLM виконується в DuckDB після перевірки. Стрілки 1–12 — потоки даних.</desc>
<defs>
<marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mh"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mh"/></marker>
<marker id="aeo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mho"/></marker>
<marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mho"/></marker>
</defs>
<path class="zone" d="M15 15 H1210 V205 H1590 V945 H15 Z"/><text class="zl" x="30" y="932">Комп’ютер користувача (Windows) · розрахунки, дані, SQL, RAG і звіти — локально</text><text class="zlo" x="1230" y="36">Інтернет · HTTPS</text><rect class="b user" x="30" y="45" width="240" height="120"/><g class="ic" transform="translate(44 55) scale(.875)"><rect x="3" y="3.5" width="18" height="13" rx="1.5"/><circle cx="12" cy="8.5" r="2.2"/><path d="M8 15c.4-2 2-3 4-3s3.6 1 4 3M9 20.5h6M12 16.5v4"/></g><text class="bt" x="73" y="71">Користувач у браузері</text><text class="bl" x="44" y="93">Chrome / Edge · Vue + Quasar</text><text class="bl" x="44" y="109">формули MathJax</text><text class="bl" x="44" y="125">усі ресурси локальні</text><rect class="b core" x="325" y="60" width="850" height="75"/><g class="ic" transform="translate(339 70) scale(.875)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18M9.5 12l-2.5 2.5 2.5 2.5M14.5 12l2.5 2.5-2.5 2.5"/></g><text class="bt" x="368" y="86">Інтерфейс і API</text><text class="bl" x="339" y="108">NiceGUI 3 (сторінки) + FastAPI (HTTP /api, JSON) на uvicorn</text><rect class="b core" x="325" y="170" width="850" height="65"/><g class="ic" transform="translate(339 180) scale(.875)"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></g><text class="bt" x="368" y="196">Сервіс-оркестратор (ProjectService)</text><text class="bl" x="339" y="218">центр сервісу: перевіряє дані й проєкт, викликає всі модулі й AI, виконує інструменти чату</text><rect class="b grp" x="325" y="275" width="530" height="270"/><text class="bt" x="339" y="301">Аналітичні модулі</text><rect class="b mod" x="340" y="315" width="155" height="80"/><g class="ic" transform="translate(352 325) scale(.875)"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5v13c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-13"/><path d="M4 12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8"/></g><text class="btm" x="381" y="341">Дані й</text><text class="btm" x="381" y="359">статистика</text><text class="bl" x="352" y="381">pandas, NumPy</text><rect class="b mod" x="513" y="315" width="155" height="80"/><g class="ic" transform="translate(525 325) scale(.875)"><rect x="3" y="10" width="4" height="10" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="17" y="13" width="4" height="7" rx="1"/></g><text class="btm" x="554" y="341">Графіки</text><text class="bl" x="525" y="363">SVG, спільна тема</text><rect class="b mod" x="686" y="315" width="155" height="80"/><g class="ic" transform="translate(698 325) scale(.875)"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></g><text class="btm" x="727" y="341">Підготовка</text><text class="btm" x="727" y="359">й агрегація</text><text class="bl" x="698" y="381">вибірки, з’єднання</text><rect class="b mod" x="340" y="445" width="155" height="80"/><g class="ic" transform="translate(352 455) scale(.875)"><path d="M4 3.5V20h16.5"/><path d="M6.5 17.5L19.5 6"/><circle cx="8.5" cy="12.5" r=".55" fill="black"/><circle cx="11.5" cy="16" r=".55" fill="black"/><circle cx="14.5" cy="9" r=".55" fill="black"/><circle cx="17.5" cy="12.5" r=".55" fill="black"/></g><text class="btm" x="381" y="471">Модель</text><text class="bl" x="352" y="493">scikit-learn, SciPy</text><rect class="b mod" x="686" y="445" width="155" height="80"/><g class="ic" transform="translate(698 455) scale(.875)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></g><text class="btm" x="727" y="471">Звіти</text><text class="bl" x="698" y="493">знімок → .qmd</text><rect class="b grp ai" x="885" y="275" width="290" height="345"/><text class="bt" x="899" y="301">AI — лише явною дією</text><rect class="b mod modai" x="900" y="312" width="260" height="75"/><g class="ic o" transform="translate(912 322) scale(.875)"><path d="M4 5.5h16v10H10l-4.5 3.5v-3.5H4z"/><path d="M8 9.5h8M8 12.5h5"/></g><text class="btm" x="941" y="338">Чат-помічник</text><text class="bl" x="912" y="360">Порадь · Виконай · Поясни</text><rect class="b mod modai" x="900" y="445" width="260" height="80"/><g class="ic o" transform="translate(912 455) scale(.875)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="black"/><path d="M19 15.5v4M17 17.5h4"/></g><text class="btm" x="941" y="471">Вбудовані AI-функції</text><text class="bl" x="912" y="493">пояснення, висновки,</text><text class="bl" x="912" y="509">чернетка звіту</text><rect class="b mod" x="900" y="540" width="260" height="70"/><g class="ic" transform="translate(912 550) scale(.875)"><path d="M7 7l-5 5 5 5M17 7l5 5-5 5M14 4l-4 16"/></g><text class="btm" x="941" y="566">SQL від LLM</text><text class="bl" x="912" y="588">перевірка: 1 SELECT, 5 с, 512 МБ</text><rect class="b rep" x="686" y="570" width="155" height="62"/><g class="ic" transform="translate(698 580) scale(.875)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g><text class="btm" x="727" y="596">Quarto 1.10</text><text class="bl" x="698" y="618">офлайн → HTML</text><rect class="b store grp2" x="325" y="650" width="850" height="215"/><text class="bt" x="339" y="676">Сховища · runtime/</text><rect class="b" x="340" y="712" width="240" height="110"/><g class="ic" transform="translate(352 722) scale(.875)"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g><text class="btm" x="381" y="738">Файли</text><text class="bl" x="352" y="760">CSV-оригінали з SHA-256, .npz,</text><text class="bl" x="352" y="776">HTML звітів, книжки й вектори,</text><text class="bl" x="352" y="792">файли моделі bge-m3</text><rect class="b" x="595" y="712" width="250" height="110"/><g class="ic" transform="translate(607 722) scale(.875)"><circle cx="9" cy="7.5" r="3.6"/><path d="M12.4 8.3h4.1"/><circle cx="8.4" cy="6.8" r=".5" fill="black"/><path d="M4.5 12.5c-1 4.5 2.5 8 7.5 8s8.5-2.5 8.5-6.5c-2.2 1.2-4.5.6-6.5-1.2"/></g><text class="btm" x="636" y="738">Постійна DuckDB</text><text class="bl" x="607" y="760">набори й результати з версіями:</text><text class="bl" x="607" y="776">статистика, дані графіків,</text><text class="bl" x="607" y="792">метрики, прогнози, залишки</text><rect class="b" x="900" y="712" width="260" height="110"/><g class="ic" transform="translate(912 722) scale(.875)"><ellipse cx="10" cy="5.5" rx="6.5" ry="2.4"/><path d="M3.5 5.5v12.5c0 1.3 2.9 2.4 6.5 2.4M16.5 5.5v3.5M3.5 11.8c0 1.3 2.9 2.4 6.5 2.4"/><path d="M21 9.5c-3.5.5-6 3.5-7 10.5M14.6 16.5l3-1"/></g><text class="btm" x="941" y="738">SQLite (схема v16)</text><text class="bl" x="912" y="760">проєкти, реєстр наборів, метадані,</text><text class="bl" x="912" y="776">запуски, налаштування, журнали</text><text class="bl" x="912" y="792">подій і AI, правила RAG, висновки</text><rect class="b llm" x="1230" y="50" width="340" height="115"/><g class="ic o" transform="translate(1244 60) scale(.875)"><rect x="4.5" y="8" width="15" height="11.5" rx="3"/><path d="M12 8V4.8M10 16h4M2.5 12.5v3M21.5 12.5v3"/><circle cx="12" cy="3.8" r="1.1"/><circle cx="9.3" cy="12.6" r="1.2" fill="black"/><circle cx="14.7" cy="12.6" r="1.2" fill="black"/></g><text class="bt" x="1273" y="76">LLM · OpenAI Responses API</text><text class="bl" x="1244" y="98">gpt-6-luna / gpt-6.1-sol</text><text class="bl" x="1244" y="114">ключ лише в .env · через інтернет</text><rect class="b rag" x="1230" y="290" width="340" height="120"/><g class="ic" transform="translate(1244 300) scale(.875)"><path d="M3 5h5.5A2.5 2.5 0 0 1 11 7.5V19a2 2 0 0 0-2-2H3z"/><circle cx="16.5" cy="12.5" r="3.6"/><path d="M19.2 15.2l2.3 2.3"/></g><text class="bt" x="1273" y="316">RAG · база знань</text><text class="bl" x="1244" y="338">правила (SQLite) + 106 уривків книжок</text><text class="bl" x="1244" y="354">гібридний пошук: TF-IDF + вектори</text><text class="bl" x="1244" y="370">→ 3–5 фрагментів із джерелами</text><rect class="b rag" x="1230" y="460" width="340" height="125"/><g class="ic" transform="translate(1244 470) scale(.875)"><path d="M3 6h7M3 10h5M3 14h7M3 18h4M11.5 12h3.5M13.5 10l2 2-2 2"/><rect x="18" y="6" width="1.6" height="1.6" fill="black"/><rect x="18" y="9.5" width="1.6" height="1.6" fill="black"/><rect x="18" y="13" width="1.6" height="1.6" fill="black"/><rect x="18" y="16.5" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="6" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="9.5" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="13" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="16.5" width="1.6" height="1.6" fill="black"/></g><text class="bt" x="1273" y="486">Модель embeddings BAAI/bge-m3</text><text class="bl" x="1244" y="508">завантажена з Hugging Face (Setup, SHA-256)</text><text class="bl" x="1244" y="524">ONNX Runtime, локально, ~2,3 ГБ</text><text class="bl" x="1244" y="540">текст → вектор із 1024 чисел</text><path class="ln" d="M270 97 H325" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="297" cy="97" r="13"/><text class="bn" x="297" y="101.5">1</text><path class="ln" d="M750 135 V170" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="750" cy="152" r="13"/><text class="bn" x="750" y="156.5">2</text><path class="ln" d="M590 235 V275" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="560" cy="255" r="13"/><text class="bn" x="560" y="259.5">3</text><path class="ln" d="M1030 235 V275" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1060" cy="255" r="13"/><text class="bn" x="1060" y="259.5">4</text><path class="bus2" d="M460 692 H1160"/><circle class="jn" cx="630" cy="692" r="3.5"/><circle class="jn" cx="1100" cy="692" r="3.5"/><circle class="jn" cx="1160" cy="692" r="3.5"/><path class="ln" d="M460 692 V712" marker-end="url(#ae)"/><path class="ln" d="M720 692 V712" marker-end="url(#ae)"/><path class="ln" d="M1030 692 V712" marker-end="url(#ae)"/><path class="ln" d="M