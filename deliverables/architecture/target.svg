<svg viewBox="0 0 1600 980" role="img" aria-labelledby="target-title target-desc" xmlns="http://www.w3.org/2000/svg">
<title id="target-title">Цільова архітектура Data Story — перебудова в роботі</title>
<desc id="target-desc">Сервіс пов’язує аналітичні модулі з постійною DuckDB. Чат-помічник і вбудовані AI-функції користуються спільним доступом до SQL, RAG та OpenAI. SQLite зберігає службовий стан; Quarto формує звіти.</desc>
<defs><marker id="target-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#174690"/></marker></defs>
<style>
.target-box {fill:#fff;stroke:#174690;stroke-width:2}
.target-db {fill:#e1e7f3}.target-ai {fill:#fbefe0;stroke:#c76a00}
.target-edge {fill:none;stroke:#174690;stroke-width:2;marker-start:url(#target-arrow);marker-end:url(#target-arrow)}
.target-title {font:700 24px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#262626}
.target-text {font:18px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#5f5f5f}
.target-label {font:16px 'IBM Plex Sans','Segoe UI',sans-serif;fill:#174690}
</style>
<path class="target-edge" d="M280 105H400"/>
<path class="target-edge" d="M500 160V250"/>
<path class="target-edge" d="M810 160V250"/>
<path class="target-edge" d="M1325 160V250"/>
<path class="target-edge" d="M290 410V500"/>
<path class="target-edge" d="M810 350V500"/>
<path class="target-edge" d="M1325 350V425H835V500"/>
<path class="target-edge" d="M600 565H540"/>
<path class="target-edge" d="M1020 565H1100"/>
<path class="target-edge" d="M810 630V800"/>
<path class="target-edge" d="M435 160V205H15V850H40"/>
<path class="target-edge" d="M540 340H565V740H1325V800"/>
<text class="target-label" x="305" y="88">дія / результат</text>
<text class="target-label" x="310" y="460">дані та результати</text>
<text class="target-label" x="570" y="460">виклики дозволених інструментів</text>
<text class="target-label" x="548" y="548">SQL</text>
<text class="target-label" x="1030" y="548">пошук</text>
<text class="target-label" x="830" y="690">запит і відповідь</text>
<text class="target-label" x="1040" y="728">Markdown і готові графіки</text>
<rect class="target-box" x="40" y="50" width="240" height="110"/>
<text class="target-title" x="60" y="91">Користувач</text><text class="target-text" x="60" y="126">явні дії в інтерфейсі</text>
<rect class="target-box target-db" x="400" y="50" width="1150" height="110"/>
<text class="target-title" x="425" y="91">Інтерфейс та спільний сервіс</text>
<text class="target-text" x="425" y="126">NiceGUI + FastAPI · перевірка параметрів, поточний проєкт, маршрутизація й журнали</text>
<rect class="target-box" x="40" y="250" width="500" height="160"/>
<text class="target-title" x="60" y="287">Аналітичні модулі</text>
<text class="target-text" x="60" y="322">Дані, статистика, підготовка й зведення</text>
<text class="target-text" x="60" y="355">Моделювання, графіки та знімки звітів</text>
<text class="target-text" x="60" y="388">pandas / NumPy / sklearn / SciPy / SVG</text>
<rect class="target-box target-ai" x="600" y="250" width="420" height="100"/>
<text class="target-title" x="620" y="288">AI-помічник — чат</text><text class="target-text" x="620" y="325">питання, поради й виконання задач</text>
<rect class="target-box target-ai" x="1100" y="250" width="450" height="100"/>
<text class="target-title" x="1120" y="288">Вбудовані AI-функції</text><text class="target-text" x="1120" y="325">чернетки, висновки й пояснення</text>
<rect class="target-box target-db" x="40" y="500" width="500" height="180"/>
<text class="target-title" x="60" y="541">Постійна DuckDB</text>
<text class="target-text" x="60" y="580">Таблиці даних і збережена статистика</text>
<text class="target-text" x="60" y="614">Коефіцієнти, метрики, прогнози, залишки</text>
<text class="target-text" x="60" y="648">Дані графіків · версії та походження</text>
<rect class="target-box" x="600" y="500" width="420" height="130"/>
<text class="target-title" x="620" y="538">Спільний доступ AI</text>
<text class="target-text" x="620" y="572">Схема таблиць і SQL від LLM</text>
<text class="target-text" x="620" y="606">Перевірка SQL · виконання сервісом</text>
<rect class="target-box" x="1100" y="500" width="450" height="130"/>
<text class="target-title" x="1120" y="538">Локальний RAG</text>
<text class="target-text" x="1120" y="572">Правила й книжкові уривки</text>
<text class="target-text" x="1120" y="606">bge-m3 + TF-IDF · джерела</text>
<rect class="target-box" x="40" y="800" width="500" height="100"/>
<text class="target-title" x="60" y="838">SQLite — службовий стан</text>
<text class="target-text" x="60" y="875">Проєкти, конфігурації, журнали, тексти</text>
<rect class="target-box target-ai" x="600" y="800" width="420" height="100"/>
<text class="target-title" x="620" y="838">OpenAI · через інтернет</text>
<text class="target-text" x="620" y="875">Спільний клієнт · моделі за задачами</text>
<rect class="target-box" x="1100" y="800" width="450" height="100"/>
<text class="target-title" x="1120" y="838">Quarto — локальні звіти</text>
<text class="target-text" x="1120" y="875">Збережений знімок → HTML</text>
<text class="target-label" x="40" y="949">Цільова схема. SQL від LLM та переведення всіх аналітичних модулів на DuckDB ще в роботі.</text>
</svg>
