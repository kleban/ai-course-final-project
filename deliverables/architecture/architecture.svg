<svg viewBox="0 0 1600 930" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Архітектура Data Story</title>
<desc id="d">Браузер; сервер Data Story з модулями, чат-помічником, вбудованими AI-функціями й аналітичними запитами; постійна DuckDB, SQLite і файли; RAG з моделлю bge-m3; Quarto; OpenAI через інтернет. Стрілки 1–12 — потоки даних.</desc>
<defs>
<marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mh"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mh"/></marker>
<marker id="aeo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mho"/></marker>
<marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mho"/></marker>
</defs>
<path class="zone" d="M15 15 H1590 V700 H1190 V880 H15 Z"/><text class="zl" x="30" y="904">Комп’ютер користувача (Windows) · розрахунки, дані, SQL, RAG і звіти — локально</text><text class="zlo" x="1215" y="722">Інтернет · HTTPS</text><rect class="b user" x="30" y="70" width="210" height="190"/><text class="bt" x="44" y="96">Користувач</text><text class="bt" x="44" y="115">у браузері</text><text class="bl" x="44" y="138">Chrome / Edge</text><text class="bl" x="44" y="154">інтерфейс Vue + Quasar</text><text class="bl" x="44" y="170">формули MathJax</text><text class="bl" x="44" y="186">(усі ресурси локальні)</text><rect class="b rep" x="30" y="380" width="240" height="120"/><text class="bt" x="44" y="406">Звіти · Quarto 1.10</text><text class="bl" x="44" y="429">окремий процес (CLI), офлайн</text><text class="bl" x="44" y="445">Markdown (.qmd) + SVG → HTML</text><rect class="srv" x="320" y="35" width="820" height="617"/><text class="srvl" x="338" y="62">Сервер Data Story · один процес Python 3.13 · 127.0.0.1:8765</text><rect class="b core" x="345" y="80" width="762" height="90"/><text class="bt" x="359" y="106">Інтерфейс і API</text><text class="bl" x="359" y="129">NiceGUI 3 (сторінки, WebSocket) + FastAPI (HTTP /api, JSON) на uvicorn — спільний ProjectService</text><rect class="b core" x="345" y="220" width="762" height="90"/><text class="bt" x="359" y="246">Сервіс-оркестратор (ProjectService)</text><text class="bl" x="359" y="269">перевіряє вхідні дані (pydantic) і поточний проєкт, викликає модулі, пише журнал подій;</text><text class="bl" x="359" y="285">той самий для сторінок, кнопок, чату й HTTP API; AI — лише явною дією користувача</text><rect class="b mod" x="345" y="360" width="102" height="125"/><text class="btm" x="354" y="386">Звіти</text><text class="blm" x="354" y="409">знімок</text><text class="blm" x="354" y="425">результатів</text><text class="blm" x="354" y="441">→ Markdown</text><text class="blm" x="354" y="457">(.qmd)</text><path class="ln" d="M396 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M396 485 V520"/><rect class="b mod" x="455" y="360" width="102" height="125"/><text class="btm" x="464" y="386">Дані й</text><text class="btm" x="464" y="405">статистика</text><text class="blm" x="464" y="428">pandas,</text><text class="blm" x="464" y="444">NumPy, CSV,</text><text class="blm" x="464" y="460">пропуски</text><path class="ln" d="M506 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M506 485 V520"/><rect class="b mod" x="565" y="360" width="102" height="125"/><text class="btm" x="574" y="386">Графіки</text><text class="blm" x="574" y="409">SVG сервісу,</text><text class="blm" x="574" y="425">спільна тема,</text><text class="blm" x="574" y="441">MathJax</text><path class="ln" d="M616 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M616 485 V520"/><rect class="b mod" x="675" y="360" width="102" height="125"/><text class="btm" x="684" y="386">Підготовка</text><text class="btm" x="684" y="405">й зведення</text><text class="blm" x="684" y="428">вибірки,</text><text class="blm" x="684" y="444">з’єднання,</text><text class="blm" x="684" y="460">зведення</text><path class="ln" d="M726 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M726 485 V520"/><rect class="b mod" x="785" y="360" width="102" height="125"/><text class="btm" x="794" y="386">Модель</text><text class="blm" x="794" y="409">scikit-learn,</text><text class="blm" x="794" y="425">SciPy,</text><text class="blm" x="794" y="441">p-value</text><path class="ln" d="M836 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M836 485 V520"/><rect class="b mod modai" x="895" y="360" width="102" height="125"/><text class="btm" x="904" y="386">Чат-</text><text class="btm" x="904" y="405">помічник</text><text class="blm" x="904" y="428">Порадь,</text><text class="blm" x="904" y="444">Виконай,</text><text class="blm" x="904" y="460">Поясни;</text><text class="blm" x="904" y="476">SQL від LLM</text><path class="ln" d="M946 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><rect class="b mod modai" x="1005" y="360" width="102" height="125"/><text class="btm" x="1014" y="386">Вбудовані</text><text class="btm" x="1014" y="405">AI-функції</text><text class="blm" x="1014" y="428">пояснення,</text><text class="blm" x="1014" y="444">висновки,</text><text class="blm" x="1014" y="460">чернетки</text><text class="blm" x="1014" y="476">звітів</text><path class="ln" d="M1056 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="396" cy="335" r="13"/><text class="bn" x="396" y="339.5">3</text><path class="bus" d="M396 520 H836"/><text class="busl" x="480" y="540">спільні збережені результати</text><rect class="b core" x="880" y="545" width="245" height="95"/><text class="bt" x="894" y="571">Аналітичні запити</text><text class="bl" x="894" y="594">SQL від LLM → перевірка сервісом</text><text class="bl" x="894" y="610">1 SELECT · лише таблиці проєкту</text><text class="bl" x="894" y="626">5 с · 512 МБ · до 10 000 рядків</text><rect class="b store" x="320" y="690" width="260" height="140"/><text class="bt" x="334" y="716">Файли runtime/</text><text class="bl" x="334" y="739">CSV-оригінали з SHA-256,</text><text class="bl" x="334" y="755">матриці .npz, HTML звітів,</text><text class="bl" x="334" y="771">уривки книжок, вектори .npy</text><rect class="b store" x="600" y="690" width="260" height="140"/><text class="bt" x="614" y="716">SQLite (схема v16)</text><text class="bl" x="614" y="739">проєкти, метадані, налаштування,</text><text class="bl" x="614" y="755">журнали подій і викликів AI,</text><text class="bl" x="614" y="771">тексти висновків і звітів,</text><text class="bl" x="614" y="787">правила бази знань</text><rect class="b store" x="880" y="690" width="260" height="140"/><text class="bt" x="894" y="716">Постійна DuckDB</text><text class="bl" x="894" y="739">runtime/analytics.duckdb</text><text class="bl" x="894" y="755">набори й нормалізовані таблиці,</text><text class="bl" x="894" y="771">статистика, дані графіків,</text><text class="bl" x="894" y="787">метрики, коефіцієнти, прогнози,</text><text class="bl" x="894" y="803">залишки · версії й походження</text><path class="ln" d="M240 125 H345" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="292" cy="125" r="13"/><text class="bn" x="292" y="129.5">1</text><path class="ln" d="M720 170 V220" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="720" cy="195" r="13"/><text class="bn" x="720" y="199.5">2</text><path class="ln" d="M836 520 V670 H900 V690" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="868" cy="670" r="13"/><text class="bn" x="868" y="674.5">4</text><path class="ln" d="M760 520 V690" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="760" cy="605" r="13"/><text class="bn" x="760" y="609.5">5</text><path class="ln" d="M450 520 V690" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="450" cy="605" r="13"/><text class="bn" x="450" y="609.5">6</text><path class="ln" d="M946 485 V545" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="946" cy="515" r="13"/><text class="bn" x="946" y="519.5">7</text><path class="ln" d="M1000 640 V690" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1000" cy="665" r="13"/><text class="bn" x="1000" y="669.5">8</text><path class="ln" d="M345 440 H270" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="296" cy="440" r="13"/><text class="bn" x="296" y="444.5">12</text><rect class="b rag" x="1210" y="35" width="360" height="175"/><text class="bt" x="1224" y="61">RAG · база знань</text><text class="bl" x="1224" y="84">пошук за словами (TF-IDF) і за змістом</text><text class="bl" x="1224" y="100">правила: 5 документів, 32 розділи (SQLite)</text><text class="bl" x="1224" y="116">книжки: 106 перевірених уривків</text><text class="bl" x="1224" y="132">результат: 3–5 фрагментів + джерело</text><rect class="b rag" x="1210" y="250" width="360" height="110"/><text class="bt" x="1224" y="276">Модель embeddings BAAI/bge-m3</text><text class="bl" x="1224" y="299">ONNX Runtime, локально (~2,3 ГБ)</text><text class="bl" x="1224" y="315">текст → вектор 1024 чисел</text><rect class="b llm" x="1210" y="735" width="360" height="140"/><text class="bt" x="1224" y="761">LLM · OpenAI Responses API</text><text class="bl" x="1224" y="784">gpt-6-luna / gpt-6.1-sol — за задачею</text><text class="bl" x="1224" y="800">httpx, ключ лише в .env</text><text class="bl" x="1224" y="816">єдиний компонент через інтернет</text><path class="ln" d="M1107 265 H1175 V122 H1210" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1175" cy="190" r="13"/><text class="bn" x="1175" y="194.5">9</text><path class="ln" d="M1390 210 V250" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1390" cy="230" r="13"/><text class="bn" x="1390" y="234.5">10</text><path class="ln ai" d="M1056 485 V503" marker-start="url(#aso)"/><path class="ln ai" d="M980 485 V503 H1175 V805 H1210" marker-start="url(#aso)" marker-end="url(#aeo)"/><circle class="bd bdo" cx="1175" cy="650" r="13"/><text class="bn" x="1175" y="654.5">11</text>
</svg>