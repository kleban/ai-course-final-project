<svg viewBox="0 0 1600 920" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Архітектура Data Story</title>
<desc id="d">Браузер → інтерфейс → сервіс, у якому дві групи: аналітичні модулі та AI. Аналітика працює зі сховищами й Quarto; AI — з RAG, OpenAI і через перевірений SQL з DuckDB. Стрілки 1–7 — потоки даних.</desc>
<defs>
<marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mh"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mh"/></marker>
<marker id="aeo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mho"/></marker>
<marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mho"/></marker>
</defs>
<path class="zone" d="M15 15 H1590 V690 H1210 V870 H15 Z"/><text class="zl" x="30" y="895">Комп’ютер користувача (Windows) · розрахунки, дані, SQL, RAG і звіти — локально</text><text class="zlo" x="1235" y="712">Інтернет · HTTPS</text><rect class="b user" x="30" y="45" width="240" height="130"/><text class="bt" x="44" y="71">Користувач у браузері</text><text class="bl" x="44" y="94">Chrome / Edge · Vue + Quasar</text><text class="bl" x="44" y="110">формули MathJax</text><text class="bl" x="44" y="126">усі ресурси локальні</text><rect class="b rep" x="30" y="420" width="240" height="100"/><text class="bt" x="44" y="446">Quarto 1.10</text><text class="bl" x="44" y="469">окремий процес, офлайн</text><text class="bl" x="44" y="485">.qmd + SVG → HTML-звіт</text><rect class="srv" x="300" y="35" width="880" height="605"/><text class="srvl" x="318" y="60">Сервер Data Story · один процес Python 3.13 · 127.0.0.1:8765</text><rect class="b core" x="325" y="75" width="830" height="70"/><text class="bt" x="339" y="101">Інтерфейс і API</text><text class="bl" x="339" y="124">NiceGUI 3 (сторінки) + FastAPI (HTTP /api, JSON) на uvicorn</text><rect class="b core" x="325" y="185" width="830" height="435"/><text class="bt" x="339" y="211">Сервіс-оркестратор (ProjectService)</text><text class="bl" x="339" y="234">перевіряє дані й поточний проєкт, викликає модулі, пише журнал; спільний для сторінок, чату й API</text><rect class="b grp" x="345" y="260" width="415" height="340"/><text class="bt" x="359" y="286">Аналітичні модулі</text><rect class="b mod" x="360" y="300" width="188" height="80"/><text class="btm" x="372" y="326">Дані й статистика</text><text class="bl" x="372" y="349">pandas, NumPy, CSV</text><rect class="b mod" x="558" y="300" width="188" height="80"/><text class="btm" x="570" y="326">Графіки</text><text class="bl" x="570" y="349">SVG, спільна тема</text><rect class="b mod" x="360" y="395" width="188" height="80"/><text class="btm" x="372" y="421">Підготовка й зведення</text><text class="bl" x="372" y="444">вибірки, з’єднання</text><rect class="b mod" x="558" y="395" width="188" height="80"/><text class="btm" x="570" y="421">Модель</text><text class="bl" x="570" y="444">scikit-learn, SciPy</text><rect class="b mod" x="360" y="490" width="188" height="80"/><text class="btm" x="372" y="516">Звіти</text><text class="bl" x="372" y="539">знімок → Markdown</text><rect class="b grp ai" x="780" y="260" width="355" height="340"/><text class="bt" x="794" y="286">AI — лише явною дією</text><rect class="b mod modai" x="795" y="300" width="325" height="80"/><text class="btm" x="807" y="326">Чат-помічник</text><text class="bl" x="807" y="349">Порадь · Виконай · Поясни</text><rect class="b mod modai" x="795" y="395" width="325" height="80"/><text class="btm" x="807" y="421">Вбудовані AI-функції</text><text class="bl" x="807" y="444">пояснення, висновки, чернетки звітів</text><rect class="b mod" x="795" y="490" width="325" height="95"/><text class="btm" x="807" y="516">Аналітичні запити</text><text class="bl" x="807" y="539">SQL від LLM → перевірка сервісом:</text><text class="bl" x="807" y="555">1 SELECT, таблиці проєкту, 5 с, 512 МБ</text><rect class="b store grp2" x="300" y="680" width="880" height="165"/><text class="bt" x="314" y="706">Сховища · runtime/</text><rect class="b" x="320" y="720" width="270" height="110"/><text class="btm" x="332" y="746">Файли</text><text class="bl" x="332" y="769">CSV-оригінали з SHA-256,</text><text class="bl" x="332" y="785">матриці .npz, HTML звітів,</text><text class="bl" x="332" y="801">уривки книжок, вектори</text><rect class="b" x="605" y="720" width="270" height="110"/><text class="btm" x="617" y="746">SQLite (схема v16)</text><text class="bl" x="617" y="769">проєкти, метадані, налаштування,</text><text class="bl" x="617" y="785">журнали подій і AI,</text><text class="bl" x="617" y="801">тексти висновків і звітів</text><rect class="b" x="890" y="720" width="270" height="110"/><text class="btm" x="902" y="746">Постійна DuckDB</text><text class="bl" x="902" y="769">набори й результати з версіями:</text><text class="bl" x="902" y="785">статистика, дані графіків,</text><text class="bl" x="902" y="801">метрики, прогнози, залишки</text><rect class="b rag" x="1230" y="260" width="340" height="140"/><text class="bt" x="1244" y="286">RAG · база знань</text><text class="bl" x="1244" y="309">правила (SQLite) + 106 уривків книжок</text><text class="bl" x="1244" y="325">пошук: TF-IDF + bge-m3 (ONNX)</text><text class="bl" x="1244" y="341">→ 3–5 фрагментів із джерелами</text><rect class="b llm" x="1230" y="735" width="340" height="110"/><text class="bt" x="1244" y="761">LLM · OpenAI Responses API</text><text class="bl" x="1244" y="784">gpt-6-luna / gpt-6.1-sol</text><text class="bl" x="1244" y="800">ключ лише в .env · через інтернет</text><path class="ln" d="M270 110 H325" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="297" cy="110" r="13"/><text class="bn" x="297" y="114.5">1</text><path class="ln" d="M740 145 V185" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="740" cy="165" r="13"/><text class="bn" x="740" y="169.5">2</text><path class="ln" d="M552 600 V680" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="552" cy="650" r="13"/><text class="bn" x="552" y="654.5">3</text><path class="ln" d="M345 470 H270" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="300" cy="470" r="13"/><text class="bn" x="300" y="474.5">4</text><path class="ln" d="M1135 330 H1230" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1190" cy="330" r="13"/><text class="bn" x="1190" y="334.5">5</text><path class="ln" d="M957 585 V720" marker-start="url(#as)" marker-end="url(#ae)"/><text class="busl" x="972" y="705">SQL від LLM</text><circle class="bd" cx="957" cy="650" r="13"/><text class="bn" x="957" y="654.5">6</text><path class="ln ai" d="M1135 540 H1195 V790 H1230" marker-start="url(#aso)" marker-end="url(#aeo)"/><circle class="bd bdo" cx="1195" cy="660" r="13"/><text class="bn" x="1195" y="664.5">7</text>
</svg>