</defs>
<path class="zone" d="M15 15 H1590 V640 H1150 V830 H15 Z"/><text class="zl" x="30" y="854">Комп’ютер користувача (Windows) · розрахунки, дані, RAG і звіти — локально</text><text class="zlo" x="1175" y="660">Інтернет · HTTPS</text><rect class="b user" x="30" y="70" width="210" height="190"/><text class="bt" x="44" y="96">Користувач</text><text class="bt" x="44" y="115">у браузері</text><text class="bl" x="44" y="138">Chrome / Edge</text><text class="bl" x="44" y="154">інтерфейс Vue + Quasar</text><text class="bl" x="44" y="170">формули MathJax</text><text class="bl" x="44" y="186">(усі ресурси локальні)</text><rect class="srv" x="320" y="35" width="720" height="565"/><text class="srvl" x="338" y="62">Сервер Data Story · один процес Python 3.13 · 127.0.0.1:8765</text><rect class="b core" x="345" y="80" width="670" height="90"/><text class="bt" x="359" y="106">Інтерфейс і API</text><text class="bl" x="359" y="129">NiceGUI 3 (сторінки, WebSocket) + FastAPI (HTTP /api, JSON) на uvicorn</text><rect class="b core" x="345" y="220" width="670" height="90"/><text class="bt" x="359" y="246">Сервіс-оркестратор (ProjectService)</text><text class="bl" x="359" y="269">перевіряє вхідні дані (pydantic), викликає модулі, пише журнал подій;</text><text class="bl" x="359" y="285">AI викликається лише явною дією користувача</text><rect class="b mod" x="345" y="360" width="104" height="125"/><text class="btm" x="354" y="386">Дані й</text><text class="btm" x="354" y="405">статистика</text><text class="blm" x="354" y="428">pandas, NumPy</text><text class="blm" x="354" y="444">CSV, пропуски</text><path class="ln" d="M397 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M397 485 V540"/><rect class="b mod" x="458" y="360" width="104" height="125"/><text class="btm" x="467" y="386">Графіки</text><text class="blm" x="467" y="409">SVG сервісу,</text><text class="blm" x="467" y="425">спільна тема,</text><text class="blm" x="467" y="441">MathJax</text><path class="ln" d="M510 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M510 485 V540"/><rect class="b mod" x="571" y="360" width="104" height="125"/><text class="btm" x="580" y="386">Зведення</text><text class="blm" x="580" y="409">DuckDB 1.5,</text><text class="blm" x="580" y="425">SQL складає</text><text class="blm" x="580" y="441">сервіс</text><path class="ln" d="M623 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M623 485 V540"/><rect class="b mod" x="684" y="360" width="104" height="125"/><text class="btm" x="693" y="386">Модель</text><text class="blm" x="693" y="409">scikit-learn,</text><text class="blm" x="693" y="425">SciPy (p-value)</text><path class="ln" d="M736 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M736 485 V540"/><rect class="b mod modai" x="797" y="360" width="104" height="125"/><text class="btm" x="806" y="386">AI-логіка</text><text class="blm" x="806" y="409">помічник,</text><text class="blm" x="806" y="425">висновки,</text><text class="blm" x="806" y="441">пояснення</text><path class="ln" d="M849 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M849 485 V540"/><rect class="b mod" x="910" y="360" width="104" height="125"/><text class="btm" x="919" y="386">Звіти</text><text class="blm" x="919" y="409">збирає знімок:</text><text class="blm" x="919" y="425">модель,</text><text class="blm" x="919" y="441">статистика,</text><text class="blm" x="919" y="457">графіки,</text><text class="blm" x="919" y="473">висновки</text><path class="ln" d="M962 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M962 485 V540"/><circle class="bd" cx="397" cy="335" r="13"/><text class="bn" x="397" y="339.5">3</text><path class="bus" d="M397 540 H962"/><text class="busl" x="560" y="560">спільні збережені результати</text><rect class="b store" x="320" y="670" width="350" height="140"/><text class="bt" x="334" y="696">SQLite (схема v16)</text><text class="bl" x="334" y="719">проєкти, метадані, події журналу,</text><text class="bl" x="334" y="735">вибірки, моделі, звіти, висновки,</text><text class="bl" x="334" y="751">правила бази знань, журнал викликів AI</text><rect class="b store" x="690" y="670" width="350" height="140"/><text class="bt" x="704" y="696">Файли runtime/</text><text class="bl" x="704" y="719">CSV-оригінали й зведення, матриці .npz,</text><text class="bl" x="704" y="735">SVG і HTML звітів,</text><text class="bl" x="704" y="751">уривки книжок і вектори .npy</text><path class="ln" d="M495 540 V670" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="495" cy="605" r="13"/><text class="bn" x="495" y="609.5">4</text><path class="ln" d="M760 540 V670" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="760" cy="605" r="13"/><text class="bn" x="760" y="609.5">5</text><path class="ln" d="M240 125 H345" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="292" cy="125" r="13"/><text class="bn" x="292" y="129.5">1</text><path class="ln" d="M680 170 V220" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="680" cy="195" r="13"/><text class="bn" x="680" y="199.5">2</text><rect class="b rag" x="1170" y="35" width="400" height="175"/><text class="bt" x="1184" y="61">RAG · база знань</text><text class="bl" x="1184" y="84">пошук за словами (TF-IDF) і за змістом (bge-m3)</text><text class="bl" x="1184" y="100">правила: 5 документів, 32 розділи (SQLite)</text><text class="bl" x="1184" y="116">книжки: 106 перевірених уривків із 5 книжок</text><text class="bl" x="1184" y="132">результат: 3–5 фрагментів + джерело, сторінки</text><rect class="b rag" x="1170" y="250" width="400" height="110"/><text class="bt" x="1184" y="276">Модель embeddings BAAI/bge-m3</text><text class="bl" x="1184" y="299">ONNX Runtime, локально (~2,3 ГБ)</text><text class="bl" x="1184" y="315">текст → вектор 1024 чисел</text><rect class="b rep" x="1170" y="410" width="400" height="120"/><text class="bt" x="1184" y="436">Звіти · Quarto 1.10</text><text class="bl" x="1184" y="459">окремий процес (CLI), без інтернету</text><text class="bl" x="1184" y="475">Markdown (.qmd) + SVG → HTML офлайн</text><rect class="b llm" x="1180" y="675" width="390" height="140"/><text class="bt" x="1194" y="701">LLM · OpenAI Responses API</text><text class="bl" x="1194" y="724">gpt-6-luna / gpt-6.1-sol — модель за задачею</text><text class="bl" x="1194" y="740">httpx, ключ лише в .env; до 3 рівнів моделей</text><text class="bl" x="1194" y="756">обов’язковий для AI-функцій; єдиний через інтернет</text><path class="ln" d="M1015 265 H1095 V122 H1170" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1095" cy="190" r="13"/><text class="bn" x="1095" y="194.5">6</text><path class="ln" d="M1370 210 V250" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1370" cy="230" r="13"/><text class="bn" x="1370" y="234.5">7</text><path class="ln" d="M1014 400 H1135 V470 H1170" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1135" cy="435" r="13"/><text class="bn" x="1135" y="439.5">9</text><path class="ln ai" d="M870 485 V580 H1115 V745 H1180" marker-start="url(#aso)" marker-end="url(#aeo)"/><circle class="bd bdo" cx="1115" cy="660" r="13"/><text class="bn" x="1115" y="664.5">8</text>
</svg>