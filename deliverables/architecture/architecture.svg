<marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mho"/></marker>
</defs>
<path class="zone" d="M15 15 H1385 V985 H15 Z"/><text class="zl" x="30" y="972">Комп’ютер користувача (Windows) · дані, розрахунки, SQL, RAG і звіти — локально</text><path class="zone zo" d="M1395 15 H1590 V985 H1395 Z"/><text class="zlo" x="1410" y="40">Інтернет · HTTPS</text><rect class="b user" x="25" y="60" width="250" height="120"/><g class="ic" transform="translate(39 70) scale(.875)"><rect x="3" y="3.5" width="18" height="13" rx="1.5"/><circle cx="12" cy="8.5" r="2.2"/><path d="M8 15c.4-2 2-3 4-3s3.6 1 4 3M9 20.5h6M12 16.5v4"/></g><text class="bt" x="68" y="86">Користувач у браузері</text><text class="bl" x="39" y="108">Chrome / Edge · Vue + Quasar</text><text class="bl" x="39" y="124">формули MathJax</text><text class="bl" x="39" y="140">усі ресурси локальні</text><rect class="proc" x="290" y="40" width="1090" height="660"/><text class="procl" x="306" y="64">Один процес Python · uvicorn (Start.cmd)</text><rect class="b core" x="310" y="80" width="1050" height="85"/><g class="ic" transform="translate(324 90) scale(.875)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18M9.5 12l-2.5 2.5 2.5 2.5M14.5 12l2.5 2.5-2.5 2.5"/></g><text class="bt" x="353" y="106">Фронтенд · NiceGUI-сторінки</text><text class="bl" x="324" y="128">проєкти, дані, аналіз, модель, висновки, звіт, налаштування; панель AI-помічника — у браузер через WebSocket</text><rect class="b grp" x="310" y="195" width="1050" height="495"/><text class="bt" x="324" y="221">Бекенд</text><rect class="b core" x="330" y="235" width="220" height="70"/><g class="ic" transform="translate(342 245) scale(.875)"><path d="M7 7l-5 5 5 5M17 7l5 5-5 5M14 4l-4 16"/></g><text class="btm" x="371" y="261">FastAPI · /api</text><text class="bl" x="342" y="283">HTTP JSON: рядки, файли</text><rect class="b core" x="600" y="235" width="740" height="70"/><g class="ic" transform="translate(612 245) scale(.875)"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></g><text class="btm" x="641" y="261">Сервіс-оркестратор (ProjectService)</text><text class="bl" x="612" y="283">перевіряє дані й проєкт, викликає модулі й AI, виконує інструменти чату</text><rect class="b grp" x="330" y="335" width="430" height="290"/><text class="btm" x="344" y="361">Аналітичні модулі</text><rect class="b mod" x="345" y="375" width="195" height="72"/><g class="ic" transform="translate(357 385) scale(.875)"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5v13c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-13"/><path d="M4 12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8"/></g><text class="btm" x="386" y="401">Дані й метадані</text><text class="bl" x="357" y="423">pandas, NumPy</text><rect class="b mod" x="550" y="375" width="195" height="72"/><g class="ic" transform="translate(562 385) scale(.875)"><rect x="3" y="10" width="4" height="10" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="17" y="13" width="4" height="7" rx="1"/></g><text class="btm" x="591" y="401">Статистика</text><text class="btm" x="591" y="419">й графіки</text><text class="bl" x="562" y="441">SVG, спільна тема</text><rect class="b mod" x="345" y="455" width="195" height="72"/><g class="ic" transform="translate(357 465) scale(.875)"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></g><text class="btm" x="386" y="481">Підготовка</text><text class="btm" x="386" y="499">й агрегація</text><text class="bl" x="357" y="521">вибірки, з’єднання</text><rect class="b mod" x="550" y="455" width="195" height="72"/><g class="ic" transform="translate(562 465) scale(.875)"><path d="M4 3.5V20h16.5"/><path d="M6.5 17.5L19.5 6"/><circle cx="8.5" cy="12.5" r=".55" fill="black"/><circle cx="11.5" cy="16" r=".55" fill="black"/><circle cx="14.5" cy="9" r=".55" fill="black"/><circle cx="17.5" cy="12.5" r=".55" fill="black"/></g><text class="btm" x="591" y="481">Модель</text><text class="bl" x="562" y="503">scikit-learn, SciPy</text><rect class="b mod" x="550" y="535" width="195" height="72"/><g class="ic" transform="translate(562 545) scale(.875)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></g><text class="btm" x="591" y="561">Звіти</text><text class="bl" x="562" y="583">знімок → .qmd</text><rect class="b grp ai" x="780" y="335" width="290" height="335"/><text class="btm" x="794" y="361">AI — лише явною дією</text><rect class="b mod modai" x="795" y="447" width="260" height="62"/><g class="ic o" transform="translate(807 457) scale(.875)"><path d="M4 5.5h16v10H10l-4.5 3.5v-3.5H4z"/><path d="M8 9.5h8M8 12.5h5"/></g><text class="btm" x="836" y="473">Чат-помічник</text><text class="bl" x="807" y="495">Порадь · Виконай · Поясни</text><rect class="b mod modai" x="795" y="519" width="260" height="62"/><g class="ic o" transform="translate(807 529) scale(.875)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="black"/><path d="M19 15.5v4M17 17.5h4"/></g><text class="btm" x="836" y="545">Висновки й чернетка звіту</text><text class="bl" x="807" y="567">тексти з фактів сервісу</text><rect class="b mod" x="795" y="591" width="260" height="62"/><g class="ic" transform="translate(807 601) scale(.875)"><path d="M7 7l-5 5 5 5M17 7l5 5-5 5M14 4l-4 16"/></g><text class="btm" x="836" y="617">SQL від LLM</text><text class="bl" x="807" y="639">1 SELECT, 5 с, 512 МБ</text><rect class="b mod modai" x="795" y="375" width="260" height="62"/><g class="ic o" transform="translate(807 385) scale(.875)"><rect x="4.5" y="8" width="15" height="11.5" rx="3"/><path d="M12 8V4.8M10 16h4M2.5 12.5v3M21.5 12.5v3"/><circle cx="12" cy="3.8" r="1.1"/><circle cx="9.3" cy="12.6" r="1.2" fill="black"/><circle cx="14.7" cy="12.6" r="1.2" fill="black"/></g><text class="btm" x="836" y="401">Клієнт OpenAI</text><text class="bl" x="807" y="423">повтори, рівні, журнал, вартість</text><rect class="b rag" x="1120" y="335" width="220" height="150"/><g class="ic" transform="translate(1132 345) scale(.875)"><path d="M3 5h5.5A2.5 2.5 0 0 1 11 7.5V19a2 2 0 0 0-2-2H3z"/><circle cx="16.5" cy="12.5" r="3.6"/><path d="M19.2 15.2l2.3 2.3"/></g><text class="btm" x="1161" y="361">RAG · база знань</text><text class="bl" x="1132" y="383">правила + 106 уривків</text><text class="bl" x="1132" y="399">TF-IDF + вектори</text><text class="bl" x="1132" y="415">→ 3–5 фрагментів</text><rect class="b rag" x="1120" y="505" width="220" height="165"/><g class="ic" transform="translate(1132 515) scale(.875)"><path d="M3 6h7M3 10h5M3 14h7M3 18h4M11.5 12h3.5M13.5 10l2 2-2 2"/><rect x="18" y="6" width="1.6" height="1.6" fill="black"/><rect x="18" y="9.5" width="1.6" height="1.6" fill="black"/><rect x="18" y="13" width="1.6" height="1.6" fill="black"/><rect x="18" y="16.5" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="6" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="9.5" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="13" width="1.6" height="1.6" fill="black"/><rect x="20.4" y="16.5" width="1.6" height="1.6" fill="black"/></g><text class="btm" x="1161" y="531">bge-m3 (ONNX)</text><text class="bl" x="1132" y="553">у цьому ж процесі,</text><text class="bl" x="1132" y="569">з Hugging Face під час</text><text class="bl" x="1132" y="585">Setup (SHA-256), ~2,3 ГБ,</text><text class="bl" x="1132" y="601">текст → 1024 числа</text><rect class="b rep" x="40" y="545" width="210" height="90"/><g class="ic" transform="translate(52 555) scale(.875)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g><text class="btm" x="81" y="571">Quarto 1.10</text><text class="bl" x="52" y="593">окремий процес (CLI)</text><text class="bl" x="52" y="609">офлайн → HTML</text><rect class="b store grp2" x="310" y="740" width="1050" height="150"/><text class="btm" x="324" y="766">Диск · runtime/ (відкриваються з процесу напряму)</text><rect class="b" x="330" y="780" width="320" height="95"/><g class="ic" transform="translate(342 790) scale(.875)"><ellipse cx="10" cy="5.5" rx="6.5" ry="2.4"/><path d="M3.5 5.5v12.5c0 1.3 2.9 2.4 6.5 2.4M16.5 5.5v3.5M3.5 11.8c0 1.3 2.9 2.4 6.5 2.4"/><path d="M21 9.5c-3.5.5-6 3.5-7 10.5M14.6 16.5l3-1"/></g><text class="btm" x="371" y="806">SQLite (схема v16)</text><text class="bl" x="342" y="828">проєкти, набори, метадані, запуски,</text><text class="bl" x="342" y="844">налаштування, журнали, правила RAG,</text><text class="bl" x="342" y="860">висновки й звіти</text><rect class="b" x="670" y="780" width="320" height="95"/><g class="ic" transform="translate(682 790) scale(.875)"><circle cx="9" cy="7.5" r="3.6"/><path d="M12.4 8.3h4.1"/><circle cx="8.4" cy="6.8" r=".5" fill="black"/><path d="M4.5 12.5c-1 4.5 2.5 8 7.5 8s8.5-2.5 8.5-6.5c-2.2 1.2-4.5.6-6.5-1.2"/></g><text class="btm" x="711" y="806">Постійна DuckDB</text><text class="bl" x="682" y="828">таблиці й результати з версіями:</text><text class="bl" x="682" y="844">статистика, дані графіків,</text><text class="bl" x="682" y="860">метрики, прогнози, залишки</text><rect class="b" x="1010" y="780" width="330" height="95"/><g class="ic" transform="translate(1022 790) scale(.875)"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g><text class="btm" x="1051" y="806">Файли</text><text class="bl" x="1022" y="828">CSV-оригінали з SHA-256, .npz,</text><text class="bl" x="1022" y="844">HTML і .qmd звітів, книжки,</text><text class="bl" x="1022" y="860">вектори, модель bge-m3</text><rect class="b llm" x="1405" y="560" width="175" height="130"/><g class="ic o" transform="translate(1417 570) scale(.875)"><rect x="4.5" y="8" width="15" height="11.5" rx="3"/><path d="M12 8V4.8M10 16h4M2.5 12.5v3M21.5 12.5v3"/><circle cx="12" cy="3.8" r="1.1"/><circle cx="9.3" cy="12.6" r="1.2" fill="black"/><circle cx="14.7" cy="12.6" r="1.2" fill="black"/></g><text class="btm" x="1446" y="586">OpenAI</text><text class="bl" x="1417" y="608">Responses API</text><text class="bl" x="1417" y="624">gpt-6-luna /</text><text class="bl" x="1417" y="640">gpt-6.1-sol</text><text class="bl" x="1417" y="656">ключ лише в .env</text><path class="ln" d="M275 120 H310" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="292" cy="140" r="13"/><text class="bn" x="292" y="144.5">1</text><path class="ln" d="M140 180 V270 H330" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="140" cy="225" r="13"/><text class="bn" x="140" y="229.5">2</text><path class="ln" d="M965 165 V235" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="990" cy="182" r="13"/><text class="bn" x="990" y="186.5">3</text><path class="ln" d="M550 270 H600" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="575" cy="270" r="13"/><text class="bn" x="575" y="274.5">4</text><path class="ln" d="M700 305 V335" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="675" cy="320" r="13"/><text class="bn" x="675" y="324.5">5</text><path class="ln" d="M930 305 V335" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="955" cy="320" r="13"/><text class="bn" x="955" y="324.5">6</text><path class="ln" d="M745 571 H795" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="770" cy="571" r="13"/><text class="bn" x="770" y="575.5">7</text><path class="ln" d="M550 590 H250" marker-end="url(#ae)"/><circle class="bd" cx="270" cy="590" r="13"/><text class="bn" x="270" y="594.5">8</text><path class="ln" d="M1055 478 H1120" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1088" cy="478" r="13"/><text class="bn" x="1088" y="482.5">9</text><path class="ln" d="M1230 485 V505" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1258" cy="495" r="13"/><text class="bn" x="1258" y="499.5">10</text><path class="ln ai" d="M1055 406 H1095 V320 H1370 V625 H1405" marker-end="url(#aeo)"/><circle class="bd bdo" cx="1232" cy="320" r="13"/><text class="bn" x="1232" y="324.5">11</text><path class="ln" d="M450 625 V740" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="450" cy="705" r="13"/><text class="bn" x="450" y="709.5">12</text><path class="ln" d="M925 670 V740" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="925" cy="705" r="13"/><text class="bn" x="925" y="709.5">13</text><path class="ln" d="M1230 670 V740" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1230" cy="705" r="13"/><text class="bn" x="1230" y="709.5">14</text>
