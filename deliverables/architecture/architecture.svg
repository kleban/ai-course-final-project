<svg viewBox="0 0 1600 900" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Архітектура Data Story</title>
<desc id="d">Браузер, сервер Data Story з модулями, SQLite і файли, RAG з моделлю bge-m3, Quarto та OpenAI; стрілки 1–9 — потоки даних.</desc>
<defs>
<marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mh"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mh"/></marker>
<marker id="aeo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mho"/></marker>
<marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" class="mho"/></marker>
</defs>
<path class="zone" d="M15 15 H1590 V640 H1150 V830 H15 Z"/><text class="zl" x="30" y="854">Комп’ютер користувача (Windows) · розрахунки, дані, RAG і звіти — локально</text><text class="zlo" x="1175" y="660">Інтернет · HTTPS</text><rect class="b user" x="30" y="70" width="210" height="190"/><text class="bt" x="44" y="96">Користувач</text><text class="bt" x="44" y="115">у браузері</text><text class="bl" x="44" y="138">Chrome / Edge</text><text class="bl" x="44" y="155">інтерфейс Vue + Quasar</text><text class="bl" x="44" y="172">формули MathJax</text><text class="bl" x="44" y="189">(усі ресурси локальні)</text><rect class="srv" x="320" y="35" width="720" height="565"/><text class="srvl" x="338" y="62">Сервер Data Story · один процес Python 3.13 · 127.0.0.1:8765</text><rect class="b core" x="345" y="80" width="670" height="90"/><text class="bt" x="359" y="106">Інтерфейс і API</text><text class="bl" x="359" y="129">NiceGUI 3 (сторінки, WebSocket) + FastAPI (HTTP /api, JSON) на uvicorn</text><rect class="b core" x="345" y="220" width="670" height="90"/><text class="bt" x="359" y="246">Сервіс-оркестратор (ProjectService)</text><text class="bl" x="359" y="269">перевіряє вхідні дані (pydantic), викликає модулі, пише журнал подій;</text><text class="bl" x="359" y="286">AI викликається лише явною дією користувача</text><rect class="b mod" x="345" y="360" width="124" height="125"/><text class="bt" x="359" y="386">Дані і</text><text class="bt" x="359" y="405">статистика</text><text class="bl" x="359" y="428">pandas, NumPy</text><text class="bl" x="359" y="445">CSV, метадані,</text><text class="bl" x="359" y="462">пропуски</text><path class="ln" d="M407 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M407 485 V540"/><rect class="b mod" x="481" y="360" width="124" height="125"/><text class="bt" x="495" y="386">Графіки</text><text class="bl" x="495" y="409">SVG сервісу,</text><text class="bl" x="495" y="426">спільна тема,</text><text class="bl" x="495" y="443">MathJax</text><path class="ln" d="M543 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M543 485 V540"/><rect class="b mod" x="617" y="360" width="124" height="125"/><text class="bt" x="631" y="386">Зведення</text><text class="bl" x="631" y="409">DuckDB 1.5</text><text class="bl" x="631" y="426">SQL складає</text><text class="bl" x="631" y="443">сервіс</text><path class="ln" d="M679 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M679 485 V540"/><rect class="b mod" x="753" y="360" width="124" height="125"/><text class="bt" x="767" y="386">Модель</text><text class="bl" x="767" y="409">scikit-learn:</text><text class="bl" x="767" y="426">лінійна регресія,</text><text class="bl" x="767" y="443">SciPy: p-value</text><path class="ln" d="M815 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M815 485 V540"/><rect class="b mod modai" x="889" y="360" width="124" height="125"/><text class="bt" x="903" y="386">AI-логіка</text><text class="bl" x="903" y="409">помічник,</text><text class="bl" x="903" y="426">висновки,</text><text class="bl" x="903" y="443">чернетки звіту</text><path class="ln" d="M951 310 V360" marker-start="url(#as)" marker-end="url(#ae)"/><path class="bus" d="M951 485 V540"/><circle class="bd" cx="407" cy="335" r="13"/><text class="bn" x="407" y="339.5">3</text><path class="bus" d="M407 540 H951"/><rect class="b store" x="320" y="670" width="350" height="140"/><text class="bt" x="334" y="696">SQLite (схема v16)</text><text class="bl" x="334" y="719">проєкти, метадані, події журналу,</text><text class="bl" x="334" y="736">вибірки, моделі, звіти, висновки,</text><text class="bl" x="334" y="753">правила бази знань, журнал викликів AI</text><rect class="b store" x="690" y="670" width="350" height="140"/><text class="bt" x="704" y="696">Файли runtime/</text><text class="bl" x="704" y="719">CSV-оригінали й зведення, матриці .npz,</text><text class="bl" x="704" y="736">SVG і HTML звітів,</text><text class="bl" x="704" y="753">уривки книжок і вектори .npy</text><path class="ln" d="M495 540 V670" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="495" cy="605" r="13"/><text class="bn" x="495" y="609.5">4</text><path class="ln" d="M865 540 V670" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="865" cy="605" r="13"/><text class="bn" x="865" y="609.5">5</text><path class="ln" d="M240 125 H345" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="292" cy="125" r="13"/><text class="bn" x="292" y="129.5">1</text><path class="ln" d="M680 170 V220" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="680" cy="195" r="13"/><text class="bn" x="680" y="199.5">2</text><rect class="b rag" x="1170" y="35" width="400" height="175"/><text class="bt" x="1184" y="61">RAG · база знань</text><text class="bl" x="1184" y="84">пошук за словами (TF-IDF) і за змістом (bge-m3)</text><text class="bl" x="1184" y="101">правила: 5 документів, 32 розділи (SQLite)</text><text class="bl" x="1184" y="118">книжки: 28 перевірених уривків із 5 книжок</text><text class="bl" x="1184" y="135">результат: 3–5 фрагментів + джерело, сторінки</text><rect class="b rag" x="1170" y="250" width="400" height="110"/><text class="bt" x="1184" y="276">Модель embeddings BAAI/bge-m3</text><text class="bl" x="1184" y="299">ONNX Runtime, локально (~2,3 ГБ)</text><text class="bl" x="1184" y="316">текст → вектор 1024 чисел</text><rect class="b rep" x="1170" y="410" width="400" height="120"/><text class="bt" x="1184" y="436">Звіти · Quarto 1.10</text><text class="bl" x="1184" y="459">окремий процес (CLI), без інтернету</text><text class="bl" x="1184" y="476">Markdown (.qmd) + SVG → HTML офлайн</text><rect class="b llm" x="1180" y="675" width="390" height="140"/><text class="bt" x="1194" y="701">LLM · OpenAI Responses API</text><text class="bl" x="1194" y="724">gpt-6-luna / gpt-6.1-sol — модель за задачею</text><text class="bl" x="1194" y="741">httpx, ключ лише в .env; до 3 рівнів моделей</text><text class="bl" x="1194" y="758">обов’язковий для AI-функцій; єдиний через інтернет</text><path class="ln" d="M1015 265 H1095 V122 H1170" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1095" cy="190" r="13"/><text class="bn" x="1095" y="194.5">6</text><path class="ln" d="M1370 210 V250" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1370" cy="230" r="13"/><text class="bn" x="1370" y="234.5">7</text><path class="ln" d="M1013 400 H1135 V470 H1170" marker-start="url(#as)" marker-end="url(#ae)"/><circle class="bd" cx="1135" cy="435" r="13"/><text class="bn" x="1135" y="439.5">9</text><path class="ln ai" d="M1013 445 H1115 V745 H1180" marker-start="url(#aso)" marker-end="url(#aeo)"/><circle class="bd bdo" cx="1115" cy="600" r="13"/><text class="bn" x="1115" y="604.5">8</text>
</svg>